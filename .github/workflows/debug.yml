name: Debug (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: TypeScript API lib resolution
        run: |
          node -e '
          const ts = require("typescript");
          const cfg = ts.readConfigFile("tsconfig.json", ts.sys.readFile);
          const parsed = ts.parseJsonConfigFileContent(cfg.config, ts.sys, process.cwd());
          console.log("ts", ts.version, "lib:", parsed.options.lib, "types:", parsed.options.types, "errors:", parsed.errors.length);
          const program = ts.createProgram({ rootNames: ["src/index.ts"], options: parsed.options });
          console.log("global diags:", ts.getPreEmitDiagnostics(program).filter(d => !d.file).map(d => ts.flattenDiagnosticMessageText(d.messageText, "\n")).slice(0, 5));
          console.log("lib files:", program.getSourceFiles().filter(f => f.fileName.includes("/lib/lib.")).length);
          '
      - name: typescript-eslint program for src/index.ts
        run: |
          node --input-type=module -e '
          import { parseAndGenerateServices } from "@typescript-eslint/typescript-estree";
          const code = "declare function doSomething() : Promise<void>; void doSomething();";
          const { services } = parseAndGenerateServices(code, { filePath: process.cwd() + "/src/index.ts", project: "./tsconfig.json", tsconfigRootDir: process.cwd() });
          const program = services.program;
          console.log("lib files:", program.getSourceFiles().filter(f => f.fileName.includes("/lib/lib.")).length);
          console.log("global diags:", program.getGlobalDiagnostics().map(d => String(d.messageText)).slice(0, 5));
          console.log("option diags:", program.getOptionsDiagnostics().map(d => String(d.messageText)).slice(0, 5));
          const sf = program.getSourceFile(process.cwd() + "/src/index.ts");
          console.log("source text:", JSON.stringify(sf.text.slice(0, 80)));
          const checker = program.getTypeChecker();
          const stmt = sf.statements[1];
          const type = checker.getTypeAtLocation(stmt.expression.expression);
          console.log("type:", checker.typeToString(type), "then:", !!type.getProperty("then"));
          '
      - name: Single rule test file alone
        run: npx vitest run test/eslint/rules/no-void-non-promise.test.ts 2>&1 | tail -40
